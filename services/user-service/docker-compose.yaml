services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d msgr_users"]
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:latest

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./migrations:/migrations

    entrypoint: ["migrate"]

    command:
      [
        "-path", "/migrations",
        "-database", "postgres://postgres:postgres@postgres:5432/msgr_users?sslmode=disable",
        "up"
      ]
